<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolMarket</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛠 ToolMarket</h1>

    <input type="text" id="search" placeholder="Пошук товарів...">

    <div id="cart">
        🛒 Кошик: <span id="count">0</span>
    </div>
</header>

<section class="banner">
    <h2>Професійні станки та інструменти</h2>
    <p>Найкращі ціни в Україні</p>
</section>

<section class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1581092919535-7146ff1a5905?w=600" alt="">
<h3>Токарний станок</h3>
<p>25 000 грн</p>
<button>Купити</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1504148455328-c376907d081c?w=600" alt="">
<h3>Дриль</h3>
<p>2 500 грн</p>
<button>Купити</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=600" alt="">
<h3>Болгарка</h3>
<p>3 700 грн</p>
<button>Купити</button>
</div>

</section>

<script src="script.js"></script>

</body>
</html>
