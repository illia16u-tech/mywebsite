<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolMarket - Додати товар</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div style="max-width:700px;margin:40px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 0 15px rgba(0,0,0,.15);">

<h2>➕ Додати товар</h2>

<input id="name" type="text" placeholder="Назва товару" style="width:100%;padding:10px;"><br><br>

<input id="price" type="text" placeholder="Ціна" style="width:100%;padding:10px;"><br><br>

<input id="image" type="file" accept="image/*"><br><br>

<button onclick="addProduct()" style="padding:12px 25px;font-size:18px;cursor:pointer;">
Додати товар
</button>

<hr style="margin:30px 0;">

<h2>📦 Усі товари</h2>

<div id="list"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
